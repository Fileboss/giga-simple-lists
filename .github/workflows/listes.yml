# Tests, détection de concurrence et vulnérabilités du code de Listes ; build de l'image (taille < 20 Mo).
name: Listes

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *" # govulncheck quotidien : nouvelles failles dans Go ou les dépendances

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example build
      - name: Image < 20 Mo
        run: |
          size=$(docker image inspect listes:local --format '{{.Size}}')
          echo "Taille : $size octets"
          [ "$size" -lt 20000000 ]
